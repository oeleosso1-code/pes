name: Relay scripts checks
on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/relay-checks.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/relay-checks.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in server/*.sh server/tests/*.sh; do bash -n "$f"; done
      - name: Test input validation without servers or secrets
        shell: bash
        run: |
          bash server/tests/test_validation.sh
          bash server/tests/test_client_lifecycle.sh
