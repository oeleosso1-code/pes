name: Chess AI v3 ScreenFix APK
on:
  push:
    branches: [chess-ai-v3-screenfix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK packages without setup-android action
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK not set}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Compile official Stockfish 19 for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch sf_19 https://github.com/official-stockfish/Stockfish.git stockfish
          export PATH="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          make -C stockfish/src -j2 net
          make -C stockfish/src -j2 build ARCH=armv8 COMP=ndk
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          cp stockfish/src/stockfish app/src/main/jniLibs/arm64-v8a/libstockfish.so
          cp stockfish/Copying.txt app/src/main/assets/Stockfish-GPLv3.txt
          file app/src/main/jniLibs/arm64-v8a/libstockfish.so
      - name: Compile Android debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publish installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-ai-v3-screenfix-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
