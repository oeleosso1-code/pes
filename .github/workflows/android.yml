name: Android build and unit tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: igrx1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK platform and build tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Iraq-Game-Route-X1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
