name: Android build and unit tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: igrx1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted ubuntu runners already ship Android command-line tools.
      # setup-android@v3 requests the obsolete SDK package "tools" and fails.
      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses > /dev/null || true
          "$sdkmanager_bin" --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test and build debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Upload JUnit reports (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Iraq-Game-Route-X1-unit-reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Android Lint (report-only until device certification)
        continue-on-error: true
        run: gradle --no-daemon :app:lintDebug
      - name: Verify artifact file and compute SHA-256
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Iraq-Game-Route-X1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
